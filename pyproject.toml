[project]
name = "churn-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dilharajay", email = "dilharajay@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "awscli>=1.46.1",
    "boto3>=1.43.111",
    "boto3-stubs>=1.43.111",
    "fastapi>=0.115.0",
    "flask>=3.1.3",
    "great-expectations>=1.24.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.0",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pydantic>=2.9.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.53.0",
    "uvicorn[standard]>=0.30.0",
    "xgboost>=3.4.1",
]

[project.scripts]
churn-predictor = "churn_predictor:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "kagglehub>=1.0.2",
    "openpyxl>=3.1.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
