name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - feature/*
      - feature/**
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  DOCKER_IMAGE: dilhara0592/churn-predictor
  PYTHON_VERSION: "3.11"

jobs:
  # ==============================================================================
  # 1. Continuous Integration: Test & Code Validation
  # ==============================================================================
  ci-test:
    name: Run Unit & API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Pytest Suite
        env:
          PYTHONPATH: src
          AWS_REGION: ap-southeast-2
          S3_BUCKET_NAME: churn-predictor-data
        run: |
          pytest tests/ -v --tb=short

  # ==============================================================================
  # 2. Continuous Delivery: Build & Push Docker Image to Docker Hub
  # ==============================================================================
  build-and-push:
    name: Build & Push to Docker Hub
    needs: ci-test
    runs-on: ubuntu-latest
    # Only push image on main/master branches, tags, or manual triggers
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================================
  # 3. Smoke Test: Pull and Validate Deployed Container
  # ==============================================================================
  container-smoke-test:
    name: Container Smoke Test
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Docker Image
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}:latest

      - name: Run Container
        run: |
          docker run -d \
            --name churn-api \
            -p 8000:8000 \
            -e AWS_REGION=ap-southeast-2 \
            -e S3_BUCKET_NAME=churn-predictor-data \
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Verify API Health & Single Prediction
        run: |
          echo "Waiting for container startup..."
          SUCCESS=0
          for i in {1..20}; do
            STATUS=$(curl -s http://localhost:8000/health || true)
            echo "Attempt $i: $STATUS"
            if echo "$STATUS" | grep -q "healthy"; then
              echo "API is healthy!"
              SUCCESS=1
              break
            fi
            sleep 2
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "Container failed to become healthy. Dumping container logs:"
            docker logs churn-api
            exit 1
          fi

          echo "Testing /predict endpoint..."
          RESPONSE=$(curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "gender": "Female",
              "tenure_months": 2.0,
              "contract": "Month-to-month",
              "monthly_charges": 85.50
            }')
          echo "Prediction response: $RESPONSE"
          echo "$RESPONSE" | grep "churn_prediction"

          echo "Container smoke test passed!"
          docker stop churn-api
